name: Deploy Webarsivi to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'webarsiv/**'
      - '.github/workflows/webarsiv-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webarsiv/package-lock.json

      - name: Install dependencies
        working-directory: webarsiv
        run: npm ci

      - name: Test
        working-directory: webarsiv
        run: npm test

      - name: Build
        working-directory: webarsiv
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
        run: npm run build

      - name: Prepare Pages artifact
        run: |
          mkdir site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'webarsiv' \
            ./ site/
          mkdir -p site/webarsiv
          cp -R webarsiv/dist/. site/webarsiv/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
