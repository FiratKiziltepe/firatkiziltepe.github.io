<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bağlam — Araştırma yolculuğu</title>
<meta name="description" content="Araştırma yöntemlerini gerçek problemler üzerinden öğren. Bir sorudan veriye dayalı sonuçlara uzanan altı adımlı yolculuğu keşfet.">
<meta name="theme-color" content="#fafbf7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Bağlam — beyaz yüzeyler, yeşil ana renk, turuncu vurgu; renk ve hacim modül kapaklarıyla 3B objelerde toplanır. */
:root {
  color-scheme: light;
  --bg: #F1F5F4; --yuzey: #FFFFFF; --murekkep: #11211E; --soluk: #5C6C68; --cizgi: #DFE7E5; --cizgi2: #EDF2F1;
  --ana: #0E8C7F; --ana-koyu: #0A6A60; --ana-acik: #E1F3F0;
  --vurgu: #EE6C2B; --vurgu-acik: #FFEDE2;
  --iyi: #1F9D61; --iyi-acik: #E3F5EB; --uyari: #C7472B; --uyari-acik: #FCE9E4;
  --baslik: 'Bricolage Grotesque', 'Figtree', 'Segoe UI', system-ui, sans-serif;
  --govde: 'Figtree', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --r-kart: 22px; --r-btn: 14px; --golge: 0 18px 50px -22px rgba(17, 33, 30, .28);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--murekkep); font: 400 16px/1.5 var(--govde); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4, p, ul, ol, blockquote, figure { margin: 0; padding: 0; }
ul, ol { list-style: none; }
h1, h2, h3 { font-family: var(--baslik); letter-spacing: -.015em; line-height: 1.1; text-wrap: balance; }
a { color: inherit; text-decoration: none; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--ana) 55%, white); outline-offset: 2px; border-radius: 8px; }
[hidden] { display: none !important; }
.i { width: 1.2em; height: 1.2em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.wrap { width: 100%; max-width: 1200px; margin-inline: auto; padding-inline: max(20px, env(safe-area-inset-left, 0px)); }
img.obj { display: block; pointer-events: none; user-select: none; }

/* ---------- Ortak parçalar ---------- */
.logo { display: inline-flex; align-items: center; gap: 9px; font: 700 22px/1 var(--baslik); letter-spacing: -.03em; }
.logo i { width: 26px; height: 26px; border-radius: 9px; background: var(--ana); position: relative; display: block; }
.logo i::after { content: ""; position: absolute; width: 11px; height: 11px; border-radius: 50%; background: var(--vurgu); right: -3px; bottom: -3px; box-shadow: 0 0 0 3px var(--yuzey); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 20px; border-radius: var(--r-btn); background: var(--ana); color: #fff; font-weight: 600; font-size: 15px; white-space: nowrap; transition: background .15s, transform .15s; }
.btn:hover { background: var(--ana-koyu); }
.btn:active { transform: translateY(1px); }
.btn.lg { height: 52px; padding: 0 26px; font-size: 16px; }
.btn.ghost { background: transparent; color: var(--murekkep); box-shadow: inset 0 0 0 1.5px var(--cizgi); }
.btn.ghost:hover { background: var(--yuzey); box-shadow: inset 0 0 0 1.5px var(--murekkep); }
.btn.beyaz { background: #fff; color: var(--murekkep); }
.btn.beyaz:hover { background: #fff; transform: translateY(-1px); }
.btn.tam { width: 100%; }
.btn[disabled] { background: var(--cizgi); color: #93A19D; cursor: not-allowed; transform: none; }
.kart { background: var(--yuzey); border-radius: var(--r-kart); padding: 22px; }
.cubuk { height: 6px; border-radius: 6px; background: var(--cizgi2); overflow: hidden; }
.cubuk i { display: block; height: 100%; border-radius: 6px; background: var(--ana); }
.nokta5 { display: inline-flex; gap: 4px; }
.nokta5 i { width: 8px; height: 8px; border-radius: 50%; background: var(--cizgi); }
.nokta5 i.d { background: var(--vurgu); }

/* ---------- Açılış sayfası ---------- */
.lp { background: var(--yuzey); }
.lp-nav { display: flex; align-items: center; gap: 28px; padding-block: 22px; }
.lp-nav nav { display: flex; gap: 26px; margin-left: auto; font-weight: 500; color: var(--soluk); }
.lp-nav nav button:hover { color: var(--murekkep); }
.lp-nav-btn { display: flex; gap: 10px; }
.hero { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: 56px; align-items: center; padding-block: 44px 84px; }
.hero h1 { font-size: clamp(40px, 5.3vw, 70px); font-weight: 700; line-height: 1; letter-spacing: -.035em; }
.hero h1 em { font-style: normal; color: var(--vurgu); }
.hero-txt > p { margin-top: 22px; font-size: 19px; line-height: 1.55; color: var(--soluk); max-width: 30em; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
.hero-demo { position: relative; padding: 150px 56px 0 0; }
.demo-zemin { position: absolute; inset: 0 0 44px 64px; border-radius: 40px; background: var(--ana); overflow: hidden; }
.demo-zemin::before { content: ""; position: absolute; width: 340px; height: 340px; border-radius: 50%; background: var(--ana-koyu); right: -70px; top: -110px; }
#heroCanvas { position: absolute; top: -34px; right: 8px; width: 250px; height: 250px; }
.demo-kart { position: relative; background: var(--yuzey); border-radius: 28px; padding: 22px; box-shadow: var(--golge); }
.demo-sec { display: flex; gap: 6px; flex-wrap: wrap; margin: -4px -4px 16px; }
.demo-b { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; transition: background .15s; }
.demo-b img { width: 38px; height: 38px; }
.demo-b:hover { background: var(--bg); }
.demo-b.on { background: var(--ana-acik); box-shadow: inset 0 0 0 2px var(--ana); }
.demo-konu { font-size: 14px; color: var(--soluk); font-weight: 500; }
.demo-soru { font: 600 22px/1.25 var(--baslik); letter-spacing: -.01em; margin: 6px 0 18px; min-height: 3.75em; }
.lp-sec { padding-block: 72px; }
.lp-gri { background: var(--bg); }
.sec-bas { max-width: 640px; margin-bottom: 36px; }
.sec-bas h2 { font-size: clamp(30px, 3.6vw, 44px); font-weight: 700; letter-spacing: -.03em; }
.sec-bas p { margin-top: 12px; font-size: 18px; color: var(--soluk); }
.nasil { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; }
.nasil > div { padding: 4px 32px; border-left: 1.5px solid var(--cizgi); }
.nasil > div:first-child { padding-left: 0; border-left: 0; }
.nasil img { width: 96px; height: 96px; margin: 0 0 8px -10px; }
.nasil b { font: 700 15px/1 var(--baslik); color: var(--vurgu); }
.nasil h3 { font-size: 22px; font-weight: 650; margin: 8px 0 8px; }
.nasil p { color: var(--soluk); }
.cta { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 24px; background: var(--murekkep); color: #fff; border-radius: 36px; padding: 48px 52px; overflow: hidden; }
.cta h2 { font-size: clamp(28px, 3.4vw, 42px); font-weight: 700; letter-spacing: -.03em; }
.cta p { margin: 10px 0 26px; color: #B9C7C3; font-size: 18px; }
.cta-obj { display: flex; margin: -30px -20px -30px 0; }
.cta-obj img { width: 170px; height: 170px; margin-left: -46px; }
.cta-obj img:nth-child(2) { transform: translateY(26px); }
.lp-alt { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-block: 36px; color: var(--soluk); font-size: 14px; }

/* ---------- Modül kartı (açılış + ana sayfa) ---------- */
.mod-izgara { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.mk { display: flex; flex-direction: column; background: var(--yuzey); border-radius: var(--r-kart); overflow: hidden; transition: transform .18s, box-shadow .18s; }
a.mk:hover { transform: translateY(-3px); box-shadow: var(--golge); }
.lp-gri .mk { box-shadow: none; }
.kapak { position: relative; background: var(--m); color: #fff; overflow: hidden; }
.kapak.acik { color: var(--murekkep); }
.kapak::before { content: ""; position: absolute; width: 210px; height: 210px; border-radius: 50%; background: var(--mk); right: -46px; top: -52px; }
.mk-kapak { height: 148px; padding: 16px 18px; }
.mk-kapak span { position: relative; font-weight: 600; font-size: 14px; }
.mk-kapak img { position: absolute; right: 6px; bottom: -8px; width: 150px; height: 150px; }
.mk-govde { padding: 20px 20px 22px; display: flex; flex-direction: column; gap: 14px; flex: 1; }
.mk-govde h3 { font-size: 21px; font-weight: 650; }
.mk-liste li { display: flex; align-items: center; gap: 10px; padding: 7px 0; font-size: 15px; }
.mk-liste li .i { color: var(--m); width: 15px; height: 15px; }
.mk-liste li span { flex: 1; min-width: 0; }
.mk-liste time { color: var(--soluk); font-size: 14px; font-variant-numeric: tabular-nums; }
.mk-liste li.ek { color: var(--soluk); }
.mk-liste li.ek .i { color: var(--soluk); }
.mk-liste li.ayrac { border-top: 1.5px solid var(--cizgi2); margin-top: 6px; padding-top: 13px; }
.mk-il { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
.mk-il .cubuk i { background: var(--m); }
.mk-il div:last-child { display: flex; justify-content: space-between; font-size: 14px; color: var(--soluk); }
.mk-il b { color: var(--murekkep); font-weight: 600; }

/* ---------- Giriş / kayıt ---------- */
.auth { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); min-height: 100vh; background: var(--yuzey); }
.auth-form { display: flex; flex-direction: column; padding: 28px max(24px, 6vw) 48px; }
.auth-form form { margin: auto 0; width: 100%; max-width: 400px; display: flex; flex-direction: column; }
.auth-form h1 { font-size: 38px; font-weight: 700; letter-spacing: -.03em; }
.auth-form h1 + p { color: var(--soluk); margin: 10px 0 30px; font-size: 17px; }
.alan { display: flex; flex-direction: column; gap: 7px; margin-bottom: 16px; }
.alan label { font-weight: 600; font-size: 14px; }
.alan input, .girdi { height: 50px; border-radius: 13px; border: 1.5px solid var(--cizgi); background: var(--yuzey); padding: 0 15px; width: 100%; transition: border-color .15s; }
.alan input:focus, .girdi:focus, textarea:focus { outline: none; border-color: var(--ana); box-shadow: 0 0 0 4px var(--ana-acik); }
.auth-form .btn { margin-top: 10px; }
.auth-alt { margin-top: 22px; color: var(--soluk); }
.auth-alt a { color: var(--ana); font-weight: 600; }
.auth-yan { position: relative; margin: 16px; border-radius: 36px; background: var(--ana); color: #fff; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: 48px; min-height: 420px; }
.auth-yan::before { content: ""; position: absolute; width: 520px; height: 520px; border-radius: 50%; background: var(--ana-koyu); right: -160px; top: -160px; }
.auth-yan h2 { position: relative; font-size: clamp(28px, 3vw, 40px); font-weight: 700; letter-spacing: -.03em; max-width: 12em; }
.auth-yan p { position: relative; margin-top: 12px; color: #CFEAE6; font-size: 17px; max-width: 26em; }
.auth-objs { position: absolute; inset: 0 0 auto 0; height: 62%; }
.auth-objs img { position: absolute; width: 190px; height: 190px; }
.auth-objs img:nth-child(1) { left: 8%; top: 12%; }
.auth-objs img:nth-child(2) { right: 10%; top: 6%; width: 230px; height: 230px; }
.auth-objs img:nth-child(3) { left: 36%; top: 44%; width: 210px; height: 210px; }
.auth-objs img:nth-child(4) { right: 4%; top: 58%; width: 150px; height: 150px; }

/* ---------- İlgi alanı seçimi ---------- */
.kur { min-height: 100vh; display: flex; flex-direction: column; }
.kur-ust { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 22px; }
.adimlar { display: flex; gap: 8px; font-weight: 600; font-size: 14px; color: var(--soluk); }
.adimlar li { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 99px; background: var(--yuzey); }
.adimlar li.on { background: var(--murekkep); color: #fff; }
.adimlar li.bitti { color: var(--ana); }
.kur-govde { flex: 1; padding-block: 24px 130px; }
.kur-govde h1 { font-size: clamp(30px, 4vw, 46px); font-weight: 700; letter-spacing: -.03em; }
.kur-govde h1 + p { margin-top: 10px; color: var(--soluk); font-size: 18px; }
.ilgi-izgara { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-top: 34px; }
.ik { position: relative; text-align: left; background: var(--yuzey); border-radius: var(--r-kart); padding: 14px 20px 22px; display: flex; flex-direction: column; box-shadow: inset 0 0 0 2px transparent; transition: box-shadow .15s, transform .15s; }
.ik:hover { transform: translateY(-2px); }
.ik img { width: 128px; height: 128px; margin: 0 0 4px -14px; transition: transform .25s; }
.ik:hover img, .ik.on img { transform: scale(1.08) rotate(-4deg); }
.ik b { font: 650 20px/1.2 var(--baslik); }
.ik small { color: var(--soluk); font-size: 14px; margin-top: 4px; }
.ik-tik { position: absolute; top: 16px; right: 16px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 0 0 2px var(--cizgi); color: transparent; }
.ik.on { box-shadow: inset 0 0 0 2.5px var(--ana); }
.ik.on .ik-tik { background: var(--ana); box-shadow: none; color: #fff; }
.kur-alt { position: fixed; inset: auto 0 0 0; background: color-mix(in srgb, var(--yuzey) 92%, transparent); backdrop-filter: blur(10px); border-top: 1.5px solid var(--cizgi); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 5; }
.kur-alt .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 14px; }
.kur-alt span { color: var(--soluk); font-weight: 500; }
.kur-alt .sag-grup { display: flex; gap: 10px; align-items: center; }

.alt-duzen { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 28px; align-items: start; }
.alt-yan { display: flex; flex-direction: column; gap: 8px; position: sticky; top: 20px; }
.ay { display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; border-radius: 18px; text-align: left; width: 100%; }
.ay img { width: 56px; height: 56px; }
.ay span { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.ay b { font: 650 17px/1.2 var(--baslik); }
.ay small { color: var(--soluk); font-size: 13px; }
.ay .i { color: var(--ana); }
.ay:hover { background: color-mix(in srgb, var(--yuzey) 60%, transparent); }
.ay.on { background: var(--yuzey); }
.alt-panel { background: var(--yuzey); border-radius: 28px; padding: 30px; }
.alt-panel-bas { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
.alt-panel-bas img { width: 84px; height: 84px; margin: -8px 0 -8px -10px; }
.alt-panel h1 { font-size: 32px; }
.alt-panel-bas p { color: var(--soluk); margin-top: 4px; }
.as { border-top: 1.5px solid var(--cizgi2); }
.as-bas { display: flex; align-items: center; gap: 14px; width: 100%; padding: 16px 4px; text-align: left; font-size: 17px; font-weight: 600; }
.as-kutu { width: 26px; height: 26px; border-radius: 9px; box-shadow: inset 0 0 0 2px var(--cizgi); display: grid; place-items: center; color: transparent; transition: background .15s; }
.as-bas:hover .as-kutu { box-shadow: inset 0 0 0 2px var(--ana); }
.as.on .as-kutu { background: var(--ana); box-shadow: none; color: #fff; }
.as-ic { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px 28px; align-items: end; padding: 2px 4px 22px 44px; }
.as-ic label, .as-ic .et { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
.puan { display: flex; gap: 8px; align-items: center; }
.puan button { width: 42px; height: 42px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--cizgi); font-weight: 600; color: var(--soluk); font-variant-numeric: tabular-nums; transition: background .12s, transform .12s; }
.puan button:hover { box-shadow: inset 0 0 0 1.5px var(--vurgu); transform: scale(1.06); }
.puan button.dolu { background: var(--vurgu-acik); box-shadow: inset 0 0 0 1.5px var(--vurgu); color: var(--vurgu); }
.puan button.on { background: var(--vurgu); color: #fff; }
.puan-uc { display: flex; justify-content: space-between; font-size: 13px; color: var(--soluk); margin-top: 6px; }

/* ---------- Uygulama kabuğu ---------- */
.uyg { display: grid; grid-template-columns: 244px minmax(0, 1fr); min-height: 100vh; }
.yan { background: var(--yuzey); padding: 26px 16px 20px; display: flex; flex-direction: column; gap: 30px; position: sticky; top: 0; height: 100vh; }
.yan .logo { padding-left: 10px; }
.yan nav { display: flex; flex-direction: column; gap: 4px; }
.yan nav a { display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 14px; border-radius: 14px; font-weight: 600; color: var(--soluk); }
.yan nav a:hover { background: var(--bg); color: var(--murekkep); }
.yan nav a.on { background: var(--ana); color: #fff; }
.yan-kul { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 16px; background: var(--bg); }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--vurgu); color: #fff; display: grid; place-items: center; font: 700 14px/1 var(--baslik); flex: none; }
.yan-kul b { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.yan-kul button { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: var(--soluk); }
.yan-kul button:hover { background: var(--yuzey); color: var(--murekkep); }
.ana-alan { padding: 34px clamp(20px, 3vw, 40px) 80px; min-width: 0; }
.sayfa { max-width: 1180px; margin-inline: auto; display: flex; flex-direction: column; gap: 28px; }
.sayfa.iki { display: grid; grid-template-columns: minmax(0, 1fr) 312px; gap: 28px; align-items: start; }
.kol { display: flex; flex-direction: column; gap: 26px; min-width: 0; }
.sb { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.sb h1 { font-size: 34px; font-weight: 700; letter-spacing: -.03em; }
.sb p { color: var(--soluk); margin-top: 6px; font-size: 17px; }
.sayfa h2.bb { font-size: 22px; font-weight: 650; }

.devam { position: relative; display: block; border-radius: 28px; padding: 30px 32px 34px; min-height: 236px; }
.devam-ust { position: relative; font-weight: 600; font-size: 15px; opacity: .92; }
.devam h2 { position: relative; font-size: clamp(28px, 3vw, 40px); font-weight: 700; letter-spacing: -.03em; margin: 10px 0 10px; max-width: 13em; }
.devam p { position: relative; display: flex; align-items: center; gap: 8px; font-weight: 500; margin-bottom: 24px; }
.devam .btn { position: relative; }
.devam > img { position: absolute; right: 24px; bottom: -6px; width: 230px; height: 230px; transition: transform .3s; }
.devam:hover > img { transform: translateY(-6px) rotate(-3deg); }
.devam-cubuk { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: rgba(255, 255, 255, .28); }
.devam-cubuk i { display: block; height: 100%; background: #fff; }
.kapak.acik .devam-cubuk { background: rgba(17, 33, 30, .16); }
.kapak.acik .devam-cubuk i { background: var(--murekkep); }

.sag { display: flex; flex-direction: column; gap: 20px; }
.kart-bas { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
.kart-bas h3 { font-size: 19px; font-weight: 650; }
.kart-bas a { color: var(--ana); font-weight: 600; font-size: 14px; }
.ip li { display: flex; align-items: center; gap: 10px; padding: 7px 0; }
.ip img { width: 44px; height: 44px; margin-left: -6px; }
.ip li > span:nth-child(2) { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
.ip b { font-weight: 600; font-size: 15px; }
.ip small { color: var(--soluk); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kart-not { margin-top: 12px; padding-top: 14px; border-top: 1.5px solid var(--cizgi2); color: var(--soluk); font-size: 14px; }
.halka { display: flex; align-items: center; gap: 18px; margin-bottom: 14px; }
.halka svg { width: 92px; height: 92px; flex: none; }
.halka b { font: 700 30px/1 var(--baslik); letter-spacing: -.03em; display: block; }
.halka span { color: var(--soluk); font-size: 14px; }
.il-satir { display: flex; justify-content: space-between; padding: 9px 0; border-top: 1.5px solid var(--cizgi2); font-size: 15px; }
.il-satir span:last-child { font-weight: 600; font-variant-numeric: tabular-nums; }

/* Modüller sayfası: geniş satırlar */
.mod-satir { display: grid; grid-template-columns: 210px minmax(0, 1fr) 190px; background: var(--yuzey); border-radius: var(--r-kart); overflow: hidden; transition: box-shadow .18s, transform .18s; }
.mod-satir:hover { box-shadow: var(--golge); transform: translateY(-2px); }
.ms-kapak { padding: 18px; min-height: 172px; }
.ms-kapak span { position: relative; font-weight: 600; font-size: 14px; }
.ms-kapak img { position: absolute; right: 12px; bottom: -6px; width: 150px; height: 150px; }
.ms-orta { padding: 22px 26px; display: flex; flex-direction: column; gap: 8px; }
.ms-orta h2 { font-size: 23px; font-weight: 650; }
.ms-orta p { color: var(--soluk); }
.ms-vid { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: auto; padding-top: 8px; font-size: 14px; }
.ms-vid li { display: flex; align-items: center; gap: 6px; }
.ms-vid .i { width: 13px; height: 13px; color: var(--m); }
.ms-vid li.t { color: var(--soluk); }
.ms-vid li.t .i { color: var(--iyi); width: 15px; height: 15px; }
.ms-sag { padding: 22px 24px 22px 0; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
.ms-sag .cubuk i { background: var(--m); }
.ms-sag small { color: var(--soluk); font-size: 14px; }
.ms-sag .btn { margin-top: 6px; }

/* Modül sayfası */
.geri { display: inline-flex; align-items: center; gap: 8px; color: var(--soluk); font-weight: 600; align-self: start; }
.geri:hover { color: var(--murekkep); }
.mod-bas { border-radius: 30px; padding: 34px 36px; min-height: 250px; display: flex; flex-direction: column; justify-content: center; }
.mod-bas > * { position: relative; }
.mod-bas span.no { font-weight: 600; }
.mod-bas h1 { font-size: clamp(32px, 4vw, 50px); font-weight: 700; letter-spacing: -.035em; margin: 8px 0 12px; max-width: 12em; }
.mod-bas p { max-width: 34em; font-size: 18px; opacity: .95; }
.mod-bas-alt { display: flex; align-items: center; gap: 18px; margin-top: 24px; flex-wrap: wrap; font-weight: 500; }
.mod-bas > img { position: absolute; right: 30px; bottom: -14px; width: 280px; height: 280px; }
.vid-izgara { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; margin-top: 16px; }
.vk { display: flex; flex-direction: column; gap: 6px; }
.vk-kapak { aspect-ratio: 16 / 9.4; border-radius: 20px; margin-bottom: 8px; }
.vk-kapak img { position: absolute; right: 4%; bottom: -8%; width: 52%; height: auto; aspect-ratio: 1; transition: transform .25s; }
.vk:hover .vk-kapak img { transform: scale(1.06) rotate(-3deg); }
.vk-oynat { position: absolute; left: 16px; bottom: 16px; width: 48px; height: 48px; border-radius: 50%; background: #fff; color: var(--murekkep); display: grid; place-items: center; box-shadow: 0 8px 20px -8px rgba(0, 0, 0, .4); transition: transform .18s; }
.vk:hover .vk-oynat { transform: scale(1.1); }
.vk-kapak time { position: absolute; left: 16px; top: 14px; font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; }
.vk-tik { position: absolute; right: 12px; top: 12px; height: 28px; padding: 0 10px 0 8px; border-radius: 99px; background: #fff; color: var(--iyi); display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; }
.vk h3 { font-size: 19px; font-weight: 650; }
.vk p { color: var(--soluk); font-size: 15px; }
.ikili { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin-top: 16px; }
.uk { position: relative; background: var(--yuzey); border-radius: var(--r-kart); padding: 24px 150px 24px 24px; min-height: 172px; display: flex; flex-direction: column; gap: 6px; overflow: hidden; transition: box-shadow .18s, transform .18s; }
.uk:hover { box-shadow: var(--golge); transform: translateY(-2px); }
.uk small { font-weight: 600; color: var(--soluk); font-size: 14px; }
.uk h3 { font-size: 22px; font-weight: 650; }
.uk p { color: var(--soluk); font-size: 15px; }
.uk img { position: absolute; right: 2px; bottom: -4px; width: 150px; height: 150px; }
.uk .durum { margin-top: auto; padding-top: 10px; display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; color: var(--ana); }
.uk .durum.t { color: var(--iyi); }
.uk-sekil { position: absolute; right: 22px; bottom: 22px; display: grid; grid-template-columns: repeat(3, 26px); gap: 8px; }
.uk-sekil i { height: 26px; border-radius: 9px; background: var(--cizgi2); }
.uk-sekil i.a { background: var(--m); }
.uk-sekil i.b { background: var(--vurgu-acik); box-shadow: inset 0 0 0 2px var(--vurgu); }
.son-liste { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin-top: 16px; }
.sl { background: var(--yuzey); border-radius: 18px; padding: 16px 20px; display: flex; align-items: center; gap: 14px; }
.sl:hover { box-shadow: inset 0 0 0 1.5px var(--cizgi); }
.sl > .i { width: 22px; height: 22px; color: var(--soluk); }
.sl div { flex: 1; display: flex; flex-direction: column; line-height: 1.3; }
.sl b { font-weight: 600; }
.sl small { color: var(--soluk); font-size: 14px; }
.sl .t { color: var(--iyi); }

/* ---------- Ders ekranı ---------- */
.ders { min-height: 100vh; display: flex; flex-direction: column; }
.ders-ust { display: flex; align-items: center; gap: 16px; padding: 12px clamp(16px, 2.4vw, 28px); background: var(--yuzey); border-bottom: 1.5px solid var(--cizgi2); position: sticky; top: 0; z-index: 6; }
.ders-kapat { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; background: var(--bg); flex: none; }
.ders-kapat:hover { background: var(--cizgi); }
.ders-ad { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
.ders-ad small { color: var(--soluk); font-size: 13px; font-weight: 500; }
.ders-ad b { font: 650 17px/1.2 var(--baslik); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ders-il { margin-left: auto; display: flex; align-items: center; gap: 12px; width: min(280px, 34vw); font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.ders-il .cubuk { flex: 1; }
.ders-il .cubuk i { background: var(--m); }
.ders-govde { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 348px; gap: 28px; padding: 28px clamp(16px, 2.4vw, 28px) 60px; max-width: 1380px; width: 100%; margin-inline: auto; align-items: start; }
.ders-ana { min-width: 0; display: flex; flex-direction: column; gap: 22px; }
.akis { background: var(--yuzey); border-radius: 24px; padding: 22px 16px 14px; position: sticky; top: 92px; }
.akis h2 { font-size: 19px; font-weight: 650; padding: 0 8px 6px; }
.akis h3 { font: 600 13px/1 var(--govde); color: var(--soluk); letter-spacing: 0; padding: 18px 8px 8px; }
.akis-adim { position: relative; display: flex; align-items: center; gap: 12px; padding: 10px 8px; border-radius: 13px; font-size: 15px; }
.akis-adim:hover { background: var(--bg); }
.akis-durum { position: relative; z-index: 1; width: 24px; height: 24px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--cizgi); background: var(--yuzey); display: grid; place-items: center; flex: none; color: #fff; }
.akis-durum .i { width: 14px; height: 14px; stroke-width: 3; }
.akis-adim.t .akis-durum { background: var(--iyi); box-shadow: none; }
.akis-adim.on { background: var(--bg); font-weight: 600; }
.akis-adim.on .akis-durum { box-shadow: inset 0 0 0 7px var(--m); }
.akis-adim.on.t .akis-durum { box-shadow: none; }
.akis-baslik { flex: 1; min-width: 0; line-height: 1.3; }
.akis-adim time, .akis-adim .akis-ek { color: var(--soluk); font-size: 13px; font-weight: 400; font-variant-numeric: tabular-nums; flex: none; }
.akis-grup .akis-adim + .akis-adim::before { content: ""; position: absolute; left: 19px; top: -14px; height: 28px; width: 2px; background: var(--cizgi); }

.vp { position: relative; border-radius: 24px; overflow: hidden; background: #0B1513; aspect-ratio: 16 / 9; }
.vp video { width: 100%; height: 100%; object-fit: cover; display: block; }
.vp-kapak { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: clamp(18px, 3vw, 36px); cursor: pointer; text-align: left; width: 100%; }
.vp-kapak::before { width: 70%; height: auto; aspect-ratio: 1; right: -14%; top: -30%; }
.vp-kapak img { position: absolute; right: 3%; bottom: 4%; width: 44%; height: auto; aspect-ratio: 1; }
.vp-kapak small { position: relative; font-weight: 600; font-size: 15px; }
.vp-kapak h2 { position: relative; font-size: clamp(24px, 3.6vw, 46px); font-weight: 700; letter-spacing: -.03em; max-width: 9.5em; margin-top: 6px; padding-bottom: 54px; }
.vp-buyuk { position: relative; width: 76px; height: 76px; border-radius: 50%; background: #fff; color: var(--murekkep); display: grid; place-items: center; margin-bottom: auto; box-shadow: 0 14px 30px -12px rgba(0, 0, 0, .5); transition: transform .18s; }
.vp-buyuk .i { width: 30px; height: 30px; margin-left: 4px; }
.vp-kapak:hover .vp-buyuk { transform: scale(1.08); }
.vp.basladi .vp-kapak { display: none; }
.vp-kontrol { position: absolute; left: 14px; right: 14px; bottom: 14px; display: flex; align-items: center; gap: 12px; height: 50px; padding: 0 8px; border-radius: 16px; background: rgba(11, 21, 19, .62); backdrop-filter: blur(12px); color: #fff; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.vp-kontrol button { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; flex: none; }
.vp-kontrol button:hover { background: rgba(255, 255, 255, .16); }
.vp-kontrol #vpHiz { width: auto; padding: 0 10px; }
.vp-cubuk { flex: 1; height: 18px; display: flex; align-items: center; cursor: pointer; }
.vp-cubuk span { width: 100%; height: 5px; border-radius: 5px; background: rgba(255, 255, 255, .28); overflow: hidden; }
.vp-cubuk i { display: block; height: 100%; width: 0; background: #fff; border-radius: 5px; }
.v-alt { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 28px; align-items: start; }
.v-bilgi h1 { font-size: clamp(26px, 3vw, 36px); font-weight: 700; letter-spacing: -.03em; }
.v-bilgi p { margin-top: 10px; color: var(--soluk); font-size: 17px; max-width: 38em; }
.v-bolum h3 { font: 600 14px/1 var(--govde); letter-spacing: 0; color: var(--soluk); margin-bottom: 6px; }
.v-bolum button { display: flex; gap: 12px; width: 100%; text-align: left; padding: 10px 12px; border-radius: 12px; font-weight: 500; }
.v-bolum button:hover { background: var(--yuzey); }
.v-bolum time { color: var(--m); font-weight: 700; font-variant-numeric: tabular-nums; width: 3em; }
.adim-alt { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-top: 6px; }
.adim-alt > span { color: var(--soluk); font-weight: 500; }
.adim-alt .btn { margin-left: auto; }

.ic-bas { display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
.ic-bas h1 { font-size: clamp(28px, 3.2vw, 40px); font-weight: 700; letter-spacing: -.03em; }
.ic-bas p { color: var(--soluk); margin-top: 6px; font-size: 17px; }
.bag { display: flex; align-items: center; gap: 6px; background: var(--yuzey); border-radius: 18px; padding: 6px 14px 6px 6px; }
.bag img { width: 50px; height: 50px; }
.bag div { display: flex; flex-direction: column; line-height: 1.2; }
.bag small { color: var(--soluk); font-size: 13px; }
.bag b { font-weight: 600; }
.bag select { margin-left: 8px; height: 38px; border-radius: 11px; border: 1.5px solid var(--cizgi); background: var(--yuzey); padding: 0 8px; font-size: 14px; font-weight: 500; }
.senaryo { border-radius: 26px; padding: 26px 28px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 150px; }
.senaryo > div { position: relative; }
.senaryo small { font-weight: 600; opacity: .9; }
.senaryo h2 { font-size: clamp(22px, 2.6vw, 30px); font-weight: 700; letter-spacing: -.02em; margin-top: 6px; max-width: 20em; }
.senaryo img { position: relative; width: 150px; height: 150px; margin: -24px -10px -24px 0; }
.adm { display: flex; flex-direction: column; }
.adm > li { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 18px; position: relative; padding-bottom: 26px; }
.adm > li::before { content: ""; position: absolute; left: 21px; top: 44px; bottom: 0; width: 2px; background: var(--cizgi); }
.adm > li:last-child::before { display: none; }
.adm-no { width: 44px; height: 44px; border-radius: 50%; background: var(--m); color: #fff; display: grid; place-items: center; font: 700 18px/1 var(--baslik); }
.kapak-acik .adm-no { color: var(--murekkep); }
.adm > li.kapali .adm-no { background: var(--yuzey); color: var(--soluk); box-shadow: inset 0 0 0 2px var(--cizgi); }
.adm > li.kapali h3 { color: var(--soluk); padding-top: 11px; }
.adm-ic { background: var(--yuzey); border-radius: 24px; padding: 24px 26px; display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1fr); gap: 26px; align-items: center; animation: gir .35s ease both; }
.adm-ic h3 { font-size: 23px; font-weight: 650; }
.adm-ic p { color: var(--soluk); margin-top: 8px; }
@keyframes gir { from { opacity: .0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .adm-ic { animation: none; } * { transition: none !important; } }

/* Örnek uygulama görselleri */
.g-alinti { border-radius: 18px; background: var(--bg); padding: 20px 22px; font: 500 19px/1.4 var(--baslik); letter-spacing: -.005em; }
.g-alinti.zayif { background: var(--uyari-acik); }
.g-kars { display: grid; gap: 10px; }
.g-kars div { border-radius: 16px; padding: 14px 18px; background: var(--bg); }
.g-kars small { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13px; color: var(--soluk); margin-bottom: 4px; }
.g-kars div:last-child { background: var(--iyi-acik); }
.g-kars div:last-child small { color: var(--iyi); }
.g-kars p { color: var(--murekkep); margin: 0; font-weight: 500; }
.g-akis { display: grid; gap: 8px; }
.g-akis div { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 12px; align-items: baseline; background: var(--bg); border-radius: 14px; padding: 12px 16px; }
.g-akis b { font: 650 15px/1.2 var(--baslik); color: var(--m); }
.kapak-acik .g-akis b { color: var(--murekkep); }
.g-akis span { font-size: 15px; }
.deg { display: grid; grid-template-columns: minmax(0, 1fr) 26px minmax(0, 1fr); gap: 8px; align-items: center; }
.dk { border-radius: 16px; padding: 14px 16px; background: var(--ana-acik); min-height: 86px; }
.dk.b { background: var(--vurgu-acik); }
.dk small { display: block; font-size: 13px; font-weight: 600; color: var(--ana-koyu); margin-bottom: 4px; }
.dk.b small { color: #B84A12; }
.dk b { font-weight: 600; line-height: 1.3; display: block; }
.deg > .i { color: var(--soluk); width: 22px; height: 22px; justify-self: center; }
.deg-k { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; font-weight: 600; color: var(--soluk); margin-top: 4px; }
.deg-k span { background: var(--bg); color: var(--murekkep); border-radius: 99px; padding: 6px 12px; font-size: 14px; font-weight: 500; }
.g-desen { border-radius: 18px; background: var(--bg); padding: 18px 20px; }
.g-desen b { font: 650 18px/1.2 var(--baslik); }
.g-desen p { color: var(--murekkep); margin: 8px 0 12px; font-weight: 500; }
.g-desen span { display: inline-block; background: var(--yuzey); border-radius: 99px; padding: 6px 12px; font-size: 14px; }
.g-nokta { display: grid; gap: 10px; }
.g-nokta .satir { display: grid; grid-template-columns: repeat(20, minmax(0, 1fr)); gap: 4px; }
.g-nokta .satir i { aspect-ratio: 1; border-radius: 50%; background: var(--cizgi); }
.g-nokta .satir i.s { background: var(--vurgu); box-shadow: 0 0 0 3px var(--vurgu-acik); }
.g-nokta .t0 i.r { background: #8FD3C9; } .g-nokta .t1 i.r { background: #B5BCF2; } .g-nokta .t2 i.r { background: #F2B3C6; }
.g-nokta label { display: block; font-size: 13px; font-weight: 600; color: var(--soluk); margin-bottom: 5px; }
.g-nokta figcaption { font-size: 14px; color: var(--soluk); font-weight: 500; }
.g-arac { border-radius: 18px; background: var(--bg); padding: 18px 20px; display: grid; gap: 4px; }
.g-arac b { font: 650 19px/1.25 var(--baslik); }
.g-arac small { color: var(--soluk); font-size: 14px; }
.g-hedef { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; text-align: center; font-size: 14px; font-weight: 600; }
.g-hedef svg { width: 100%; max-width: 150px; margin: 0 auto 6px; display: block; }
.g-hedef span { color: var(--soluk); }
.g-hedef div:last-child span { color: var(--iyi); }
.g-tablo { width: 100%; border-collapse: collapse; font-size: 15px; }
.g-tablo th { text-align: left; font-weight: 600; font-size: 13px; color: var(--soluk); padding: 0 0 10px; }
.g-tablo td { padding: 11px 0; border-top: 1.5px solid var(--cizgi2); font-variant-numeric: tabular-nums; }
.g-tablo td:last-child, .g-tablo th:last-child { text-align: right; font-weight: 600; }
.g-grafik { display: flex; flex-direction: column; gap: 10px; }
.g-grafik .alan-g { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; align-items: end; height: 180px; padding: 0 8px; border-bottom: 2px solid var(--cizgi); }
.g-grafik .sutun { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; height: 100%; }
.g-grafik .sutun b { font-weight: 700; font-variant-numeric: tabular-nums; }
.g-grafik .sutun i { width: min(72px, 100%); border-radius: 12px 12px 0 0; background: var(--m); }
.g-grafik .sutun:nth-child(2) i { opacity: .75; } .g-grafik .sutun:nth-child(1) i { opacity: .5; }
.g-grafik .etk { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; padding: 0 8px; text-align: center; font-size: 14px; font-weight: 500; }
.g-grafik figcaption { font-size: 13px; color: var(--soluk); font-weight: 600; }

/* ---------- Mikro görev ---------- */
.gorev { background: var(--yuzey); border-radius: 26px; padding: 28px; display: flex; flex-direction: column; gap: 20px; }
.gorev-soru { font: 600 21px/1.3 var(--baslik); letter-spacing: -.01em; max-width: 34em; }
.gorev-yon { color: var(--soluk); margin-top: -12px; }
.sr { display: flex; flex-direction: column; gap: 8px; }
.sr li { display: grid; grid-template-columns: 30px 22px minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--bg); border-radius: 16px; padding: 12px 12px 12px 14px; cursor: grab; box-shadow: inset 0 0 0 2px transparent; }
.sr li.suruk { opacity: .4; }
.sr li.ust { box-shadow: inset 0 3px 0 0 var(--ana); }
.sr .no { font: 700 16px/1 var(--baslik); color: var(--soluk); text-align: center; font-variant-numeric: tabular-nums; }
.sr .tut { color: #A9B6B2; }
.sr b { font-weight: 600; display: block; }
.sr small { color: var(--soluk); font-size: 14px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sr-ok { display: flex; gap: 4px; }
.sr-ok button { width: 34px; height: 34px; border-radius: 10px; background: var(--yuzey); display: grid; place-items: center; color: var(--soluk); }
.sr-ok button:hover { color: var(--murekkep); box-shadow: inset 0 0 0 1.5px var(--cizgi); }
.sr li.d { background: var(--iyi-acik); } .sr li.d .no { color: var(--iyi); }
.sr li.y { background: var(--uyari-acik); } .sr li.y .no { color: var(--uyari); }
.havuz { display: flex; flex-wrap: wrap; gap: 10px; min-height: 52px; padding: 14px; border-radius: 18px; border: 2px dashed var(--cizgi); }
.havuz:empty::before { content: "Tüm ifadeler yerleştirildi."; color: var(--soluk); font-size: 15px; align-self: center; }
.cip { text-align: left; background: var(--yuzey); border-radius: 13px; padding: 10px 14px; font-weight: 500; font-size: 15px; box-shadow: inset 0 0 0 1.5px var(--cizgi), 0 2px 0 var(--cizgi); cursor: grab; max-width: 100%; }
.cip:hover { box-shadow: inset 0 0 0 1.5px var(--murekkep), 0 2px 0 var(--cizgi); }
.cip.sec { box-shadow: inset 0 0 0 2px var(--ana), 0 2px 0 var(--ana); background: var(--ana-acik); }
.cip.d { background: var(--iyi-acik); box-shadow: inset 0 0 0 1.5px var(--iyi); }
.cip.y { background: var(--uyari-acik); box-shadow: inset 0 0 0 1.5px var(--uyari); }
.kutular { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.kutu { background: var(--bg); border-radius: 18px; padding: 16px; min-height: 150px; display: flex; flex-direction: column; gap: 8px; text-align: left; align-items: stretch; box-shadow: inset 0 0 0 2px transparent; transition: box-shadow .12s; cursor: pointer; }
.kutu h4 { font: 650 16px/1.2 var(--baslik); margin-bottom: 4px; }
.kutu.hedef, .kutu:hover { box-shadow: inset 0 0 0 2px var(--ana); }

.tb-n { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }

.tb-n button:hover { opacity: .7; transform: scale(1.1); }

.secenek { display: flex; gap: 14px; align-items: flex-start; width: 100%; text-align: left; background: var(--bg); border-radius: 16px; padding: 16px 18px; font-weight: 500; box-shadow: inset 0 0 0 2px transparent; }

.secenek.d { box-shadow: inset 0 0 0 2px var(--iyi); background: var(--iyi-acik); } .secenek.d i { box-shadow: inset 0 0 0 7px var(--iyi); }

.acik-duzen { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 24px; align-items: start; }

.gb.d { background: var(--iyi-acik); color: #14613D; } .gb.y { background: var(--uyari-acik); color: #8E2F1B; }

/* ---------- Ölçekler ---------- */

.son-ekran { margin: auto; max-width: 620px; text-align: center; padding: 30px 0 60px; display: flex; flex-direction: column; align-items: center; }
.son-ekran-obj { width: 260px; height: 260px; border-radius: 50%; background: var(--m); display: grid; place-items: center; margin-bottom: 28px; }

/* İlgi profili sayfası */
.pr-izgara { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }

/* Prototip ekran geçişi */
.proto { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 20; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }

.proto-hero-bar:hover { opacity: 1; }

.proto-hero-b:hover { background: rgba(255, 255, 255, .14); color: #fff; }
.proto-hero-b.on { background: var(--ana); color: #fff; }
.proto-dugme { height: 38px; padding: 0 14px; border-radius: 12px; background: var(--murekkep); color: #fff; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; opacity: .82; }
.proto-dugme:hover { opacity: 1; }
.proto-panel { background: var(--murekkep); color: #fff; border-radius: 18px; padding: 10px; width: 250px; max-height: 70vh; overflow: auto; box-shadow: var(--golge); display: flex; flex-direction: column; }
.proto-panel a, .proto-panel button { text-align: left; padding: 8px 12px; border-radius: 10px; font-size: 14px; font-weight: 500; }
.proto-panel a:hover, .proto-panel button:hover { background: rgba(255, 255, 255, .12); }
.proto-panel button { color: #F7A57B; margin-top: 4px; border-top: 1px solid rgba(255, 255, 255, .14); border-radius: 0 0 10px 10px; padding-top: 12px; }

/* ---------- Dar ekran ---------- */

/* ---------- Ek düzenlemeler ---------- */

/* ---------- Alt alan seçimi ---------- */
:root { --not-bg: #FFF7E3; --not-cizgi: #E2B24A; --not-yazi: #6E5014; }
.as-bas { padding: 0; display: block; }
.as-sec { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 16px 4px; border-radius: 12px; }

    const gozMat = mat('#9DF0D6', { emissive: '#4FE0B9', emissiveIntensity: .9, roughness: .3 });

  }

  function mount(root) {

    let faz = 'giris', aktif = 0, e = 0, saat = 0, oynuyor = !hareket.matches, otomatik = true;
    let yol = null, onceki = null, kare = 0, gorunur = true, bitti = false, kirli = true;
    let w = 1, h = 1, yuruAdim = 0, bakis = 0;
    const V = T ? new T.Vector3() : null;
    // Girişte büyük robotun yeri ve boyu (dünya birimi); boyut() ekran oranına göre ayarlar.
    let BUYUK = { x: -1.6, y: 0, z: 1.2, s: 2.2 };
    const KUCUK = .98;

    function balonYaz(etiket, metin, ek) {
      $('.j-balon-etiket').textContent = etiket; $('.j-balon-metin').textContent = metin; $('.j-balon-ek').innerHTML = ek || '';
    }
    function durum() {
      lab.dataset.faz = faz;
      const hedef = faz === 'yuru' ? yol.b : aktif, acik = faz !== 'giris' && faz !== 'acilis';
      const son = faz === 'kutlama' || faz === 'bitti';
      kartLi.forEach((li, i) => {
        li.classList.toggle('on', acik && !son && i === hedef);

      });

      if (S) S.basamak.forEach((b, i) => { b.ust.material = !acik ? S.UST.sonra : i < hedef || son ? S.UST.bitti : i === hedef ? S.UST.simdi : S.UST.sonra; });
      $('.lab-sayac').textContent = acik ? (son ? 'Yolculuk tamamlandı' : `${String(hedef + 1).padStart(2, '0')} / 06 · ${ADIMLAR[hedef].ad}`) : 'Bir soruyla başla';
      const kapali = !oynuyor || faz === 'bitti';

    }
    function faziAyarla(f) { faz = f; e = 0; durum(); kirli = true; }
    function var_(i, elle) {

    }
    function git(i, elle) {
      if (faz === 'giris' || faz === 'acilis') return;
      if (elle) otomatik = false;
      if (hareket.matches || !S) { var_(i, elle); if (elle) { e = ADIMLAR[i].sure; oynuyor = false; durum(); } return; }
      if (faz === 'bekle' && i === aktif) { if (elle) { e = 0; oynuyor = true; durum(); zamanla(); } return; }
      const a = faz === 'yuru' ? yolKonum() : aktif;
      yol = { a, b: i, sure: SURE.yuru * (1 + .35 * (Math.abs(i - a) - 1)), x0: S.robot.position.x, y0: S.robot.position.y };
      oynuyor = true; faziAyarla('yuru'); zamanla();
    }
    function yolKonum() { return Math.round(kis((S.robot.position.x - bx(0)) / (BG + BOS), 0, N - 1)); }
    function kutla() { faziAyarla('kutlama'); balonYaz('Yolculuk tamamlandı', 'Bir sorudan bilimsel bilgiye! Her sonuç yeni bir soru doğurur.', ''); $('.j-sr-only').textContent = 'Yolculuk tamamlandı.'; }
    function basla() {
      otomatik = true; aktif = 0; yol = null; saat = 0; oynuyor = !hareket.matches;
      balonYaz(GIRIS.etiket, GIRIS.metin, '');
      if (oynuyor) faziAyarla('giris'); else var_(0, false);
      zamanla();
    }

    /* ---------- Kare kare çizim ---------- */
    function robotPoz(dt) {
      const R = S.robot, hiz = dt / 1000;
      let x, y, z = .05, s = KUCUK, hedefAci = .35, yuru = false, havada = 0;
      const ust = i => ({ x: bx(i), y: bh(i) + .04 });
      if (faz === 'giris') {
        const g = hareket.matches ? 1 : yay(kis(e / 900, 0, 1));
        x = BUYUK.x; y = BUYUK.y; z = BUYUK.z; s = BUYUK.s * (.3 + .7 * g); hedefAci = .18;
      } else if (faz === 'acilis') {

      } else { const u = ust(aktif); x = u.x; y = u.y; if (faz === 'kutlama' || faz === 'bitti') hedefAci = 0; }
      R.position.set(x, y, z); R.scale.setScalar(s);
      bakis = hareket.matches ? hedefAci : bakis + aci(bakis, hedefAci) * Math.min(1, hiz * 9);
      R.rotation.y = bakis;

      const k0 = S.kol[0], k1 = S.kol[1];
      k0.rotation.set(0, 0, -.1); k1.rotation.set(0, 0, .1); S.kafa.rotation.set(0, 0, 0);
      S.bacak.forEach(b => b.rotation.set(0, 0, 0)); S.govde.position.y = 0;
      if (hareket.matches) return;
      const nefes = Math.sin(saat / 700) * .012;

        S.kafa.rotation.z = Math.sin(saat / 900) * .08 * g; S.kafa.rotation.x = -.06 * g;

        k0.rotation.x = -sl * .5; k1.rotation.x = sl * .5;

        S.govde.position.y = Math.abs(Math.cos(yuruAdim)) * .04 * (1 - havada);
      } else if (faz === 'kutlama' || faz === 'bitti') {
        const g = faz === 'kutlama' ? Math.sin(kis(e / SURE.kutlama, 0, 1) * Math.PI) : 0;
        k0.rotation.z = -.1 - (faz === 'kutlama' ? 2.5 : .2); k1.rotation.z = .1 + (faz === 'kutlama' ? 2.5 : .2);
        S.govde.position.y = Math.abs(Math.sin(saat / 170)) * .14 * g + nefes;
      } else if (faz === 'bekle') {
        // Balonu gösterir gibi kolunu kaldırır, sonra indirir
        const q = kis(e / ADIMLAR[aktif].sure, 0, 1), isaret = Math.min(1, Math.sin(q * Math.PI) * 2.2);
        k0.rotation.z = -.1 - 1.5 * isaret; k0.rotation.x = -.4 * isaret;
        S.kafa.rotation.x = -.12 * isaret; S.govde.position.y = nefes;

    }

    function sahne() {
      // Basamaklar açılışta sırayla yükselir
      const ac = faz === 'giris' ? 0 : faz === 'acilis' && !hareket.matches ? e / SURE.acilis : 1;
      S.basamak.forEach((b, i) => { const v = cik(kis(ac * 1.6 - i * .12, 0, 1)); b.g.scale.set(1, Math.max(.001, v), 1); b.g.visible = v > .002; });
      const bk = faz === 'kutlama' ? cik(kis(e / 700, 0, 1)) : faz === 'bitti' ? 1 : 0;

    function ekran(x, y, z) { V.set(x, y, z).project(S.camera); return { x: (V.x * .5 + .5) * w, y: (-V.y * .5 + .5) * h }; }

      });

        const bw = balon.offsetWidth, bhh = balon.offsetHeight;

      } else {

        const dar = w < 520;
        balon.style.width = dar ? `${w - 16}px` : '';

          balon.classList.remove('j-balon-sol', 'j-balon-sag');

          left = dar ? 8 : kis(bas.x - bw * f, 8, w - bw - 8); top = dar ? 6 : bas.y - bhh - 16;
          kuyruk = kis(bas.x - left, 22, bw - 22);
        } else {
          const solKenar = ekran(R.position.x - .52 * R.scale.x, R.position.y + 1.0 * R.scale.x, R.position.z);
          const sagKenar = ekran(R.position.x + .52 * R.scale.x, R.position.y + 1.0 * R.scale.x, R.position.z);
          const solAlan = solKenar.x - 14 - 8;
          const sagAlan = (w - 8) - (sagKenar.x + 14);
          if (solAlan >= sagAlan) {
            balon.classList.add('j-balon-sol'); balon.classList.remove('j-balon-sag');
            if (solAlan < bw) { balon.style.width = `${Math.max(200, solAlan)}px`; bw = balon.offsetWidth; bhh = balon.offsetHeight; }
            left = Math.max(8, solKenar.x - bw - 14); top = kis(solKenar.y - bhh / 2, 6, h - bhh - 6);
            kuyruk = kis(solKenar.y - top, 18, bhh - 18);
          } else {
            balon.classList.add('j-balon-sag'); balon.classList.remove('j-balon-sol');
            if (sagAlan < bw) { balon.style.width = `${Math.max(200, sagAlan)}px`; bw = balon.offsetWidth; bhh = balon.offsetHeight; }
            left = Math.min(w - bw - 8, sagKenar.x + 14); top = kis(sagKenar.y - bhh / 2, 6, h - bhh - 6);
            kuyruk = kis(sagKenar.y - top, 18, bhh - 18);

      balon.style.transform = `translate(${left}px, ${top}px)`;
      balon.style.setProperty('--kuyruk', `${kuyruk}px`);
      let o = 1;
      if (faz === 'giris') o = hareket.matches ? 1 : kis((e - 650) / 400, 0, 1);
      else if (faz === 'acilis' || faz === 'yuru') o = 0;
      else if (faz === 'bekle') o = hareket.matches ? 1 : kis((e - 150) / 300, 0, 1);
      balon.style.opacity = o; balon.style.visibility = o > .01 ? 'visible' : 'hidden';
      const kart = faz === 'giris' ? 0 : faz === 'acilis' ? kis((e / SURE.acilis - .35) / .5, 0, 1) : 1;
      $('.j-basamaklar').style.opacity = hareket.matches ? 1 : kart;
      lab.classList.add('hazir');
    }

    function ciz(dt) { robotPoz(dt); sahne(); S.renderer.render(S.scene, S.camera); yerlestir(); kirli = false; }

    function ilerle(dt) {
      e += dt; saat += dt;
      if (faz === 'giris' && e >= SURE.giris) faziAyarla('acilis');
      else if (faz === 'acilis' && e >= SURE.acilis) var_(0, false);
      else if (faz === 'yuru' && e >= yol.sure) var_(yol.b, !otomatik);
      else if (faz === 'bekle' && e >= ADIMLAR[aktif].sure) {
        if (!otomatik) { e = ADIMLAR[aktif].sure; oynuyor = false; durum(); }
        else if (aktif === N - 1) kutla(); else git(aktif + 1, false);
      } else if (faz === 'kutlama' && e >= SURE.kutlama) { faziAyarla('bitti'); oynuyor = false; durum(); }
    }
    function tik(zaman) {
      kare = 0;
      if (bitti || !gorunur || document.hidden) { onceki = null; return; }
      const dt = onceki === null ? 16 : Math.min(zaman - onceki, 60); onceki = zaman;
      if (oynuyor) { ilerle(dt); kirli = true; }
      if (S && kirli) ciz(oynuyor ? dt : 0);
      zamanla();
    }
    function zamanla() { if (!kare && !bitti && gorunur && !document.hidden && (oynuyor || kirli)) kare = requestAnimationFrame(tik); }

    function boyut() {

      ciz(0); zamanla();
    }
    function tikla(ev) {
      const b = ev.target.closest('[data-adim], .lab-oynat, .lab-basa'); if (!b) return;
      if (b.matches('.lab-basa')) { basla(); return; }

        if (oynuyor) { otomatik = true; if (faz === 'bekle' && e >= ADIMLAR[aktif].sure) { if (aktif === N - 1) kutla(); else git(aktif + 1, false); } }

    } };
  }

})();

<script>

    { ad: 'Desen', kisa: 'Yöntemi planla', sure: 2600, etiket: 'Sorudan plana',

  const kis = (v, a, b) => Math.max(a, Math.min(b, v));

    const gunes = new T.DirectionalLight(0xfff6e8, 1.18); gunes.position.set(3, 8, 7); gunes.castShadow = true;

    Object.assign(gunes.shadow.camera, { left: -7, right: 7, top: 6, bottom: -4, near: 1, far: 30 });
    scene.add(gunes);
    const dolgu = new T.DirectionalLight(0xffffff, .35); dolgu.position.set(-6, 3, 4); scene.add(dolgu);

    const mats = {};
    const mat = (renk, o = {}) => { const k = renk + JSON.stringify(o); return mats[k] || (mats[k] = new T.MeshStandardMaterial({ color: renk, roughness: .6, metalness: 0, ...o })); };

      s.quadraticCurveTo(x + W, y + H, x + W - R, y + H); s.lineTo(x + R, y + H); s.quadraticCurveTo(x, y + H, x, y + H - R);

    const kure = (r, m) => mesh(new T.SphereGeometry(r, 24, 16), m);
    const silindir = (r1, r2, h, m, n = 24) => mesh(new T.CylinderGeometry(r1, r2, h, n), m);
    const C = { kabuk: '#F3F1EA', ana: '#0E8C7F', vurgu: '#EE6C2B', koyu: '#163A34' };

  }

  function mount(root) {

    const hareket = matchMedia('(prefers-reduced-motion: reduce)');
    const lab = $('.lab'), sahneEl = $('.lab-sahne'), canvas = $('.lab-tuval'), balon = $('.j-balon');
    const rayButtons = $$('.lab-adim-b');
    const yuzeyLi = $$('.j-yuzey-etiketler li'), yuzeyBtn = $$('.j-yuzey-kart');
    let S = null;

    let faz = 'giris', aktif = 0, maxAcik = -1, e = 0, saat = 0, oynuyor = !hareket.matches, otomatik = true;

    }

      const son = faz === 'kutlama' || faz === 'bitti';

      });

      });

      });

    }
    function faziAyarla(f) { faz = f; e = 0; durum(); kirli = true; }
    function var_(i, elle) {

    }
    function git(i, elle) {

      if (hareket.matches || !S) { maxAcik = Math.max(maxAcik, i); var_(i, elle); if (elle) { e = ADIMLAR[i].sure; oynuyor = false; durum(); } return; }

    function yolKonum() { return Math.round(kis((S.robot.position.x - bx(0)) / (BG + BOS), 0, N - 1)); }
    function kutla() { faziAyarla('kutlama'); balonYaz('Yolculuk tamamlandı', 'Bir sorudan bilimsel bilgiye! Her sonuç yeni bir soru doğurur.', ''); $('.j-sr-only').textContent = 'Yolculuk tamamlandı.'; }
    function basla() {

    }

    function robotPoz(dt) {

      const ust = i => ({ x: bx(i), y: bh(i) + .04 });
      if (faz === 'giris') {
        const g = hareket.matches ? 1 : yay(kis(e / 900, 0, 1));

      } else { const u = ust(aktif); x = u.x; y = u.y; if (faz === 'kutlama' || faz === 'bitti') hedefAci = 0; }
      R.position.set(x, y, z); R.scale.setScalar(s);
      bakis = hareket.matches ? hedefAci : bakis + aci(bakis, hedefAci) * Math.min(1, hiz * 14);

      const k0 = S.kol[0], k1 = S.kol[1];
      k0.rotation.set(0, 0, -.1); k1.rotation.set(0, 0, .1); S.kafa.rotation.set(0, 0, 0);
      S.bacak.forEach(b => b.rotation.set(0, 0, 0)); S.govde.position.y = 0;
      if (hareket.matches) return;
      const nefes = Math.sin(saat / 700) * .012;
      if (faz === 'giris') {
        const g = kis((e - 500) / 400, 0, 1);
        k1.rotation.z = .1 + g * (2.35 + Math.sin(saat / 150) * .35);
        S.kafa.rotation.z = Math.sin(saat / 900) * .08 * g; S.kafa.rotation.x = -.06 * g;
        S.govde.position.y = nefes;
      } else if (yuru) {

    function sahne() {

      S.basamak.forEach((b, i) => {
        let v = 0;

  /* Bağlam seçimi: öğrencinin seçip puanladığı alt alanlar puana göre sıralanır.
     En az 3 puan alanlar, farklı ilgi alanlarına öncelik verilerek modüllere sırayla dağıtılır.
     Eşit puanda hazır senaryosu olan alt alan, öğrencinin eklediğinin önüne geçer. */
  function siraliAltlar() {
    const l = [], p = P();
    p.secilen.map(ilgi).filter(Boolean).forEach((k, ki) => seciliAltlar(k).forEach((a, ai) => l.push({ k, a, p: p.puan[a.id] || 0, sira: ki * 20 + ai })));
    return l.sort((x, y) => y.p - x.p || (x.a.ozel ? 1 : 0) - (y.a.ozel ? 1 : 0) || x.sira - y.sira);
  }
  function baglamHavuzu() {
    const l = siraliAltlar(), aday = l.filter(x => x.p >= 3), taban = aday.length ? aday : l;
    const once = [], sonra = [], gorulen = new Set();
    taban.forEach(x => { if (gorulen.has(x.k.id)) sonra.push(x); else { gorulen.add(x.k.id); once.push(x); } });
    return [...once, ...sonra];

    const gr = {};

    return `<aside class="akis"><h2>Bu modülde</h2>${Object.entries(gr).map(([g, l]) => `<h3>${g}</h3><div class="akis-grup">${l.map(a => `<a class="akis-adim${a.t ? ' t' : ''}${a.k === k ? ' on' : ''}" data-adim="${a.k}" href="#ders-${m.id}-${a.k}"><span class="akis-durum">${a.t ? ic('check') : ''}</span><span class="akis-baslik">${a.ad}</span>${a.ek ? `<time>${a.ek}</time>` : ''}</a>`).join('')}</div>`).join('')}</aside>`;
  }
  const ileri = (m, k, act, metin = 'Devam et') => { const s = sonrakiAdim(m, k); return `<div class="adim-alt"><span>Sıradaki: ${adimAdi(m, s)}</span><a class="btn lg" href="#ders-${m.id}-${s}" data-act="${act}" data-m="${m.id}" data-k="${k}">${metin} ${ic('sag')}</a></div>`; };

  function dVideo(m, j) {
    const v = m.videolar[j], no = D.moduller.indexOf(m) + 1;
    return `<div class="vp" id="vp" data-sure="${sn(v.sure)}" data-m="${m.id}" data-j="${j}">
        <video id="vid" src="assets/video/m${no}.mp4" preload="metadata" playsinline></video>
        <button class="vp-kapak kapak${ac(m)}" id="vpKapak" aria-label="Videoyu oynat"><span class="vp-buyuk">${ic('play')}</span><small>Video ${j + 1}/${m.videolar.length}</small><h2>${v.ad}</h2>${obj(m.obj, j * 0.9 - 0.6)}</button>
        <div class="vp-kontrol"><button id="vpOyna" aria-label="Oynat / duraklat">${ic('play')}</button><span id="vpZaman">0:00 / ${v.sure}</span>
          <div class="vp-cubuk" id="vpCubuk" role="slider" aria-label="Video konumu" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0"><span><i id="vpIlerle"></i></span></div>
          <button id="vpHiz" aria-label="Oynatma hızı">1×</button><button id="vpTam" aria-label="Tam ekran">${ic('tam')}</button></div></div>
      <div class="v-alt"><div class="v-bilgi"><h1>${v.ad}</h1><p>${v.ozet}</p></div>
        <div class="v-bolum"><h3>Bölümler</h3>${v.bolumler.map(([t, a]) => `<button data-act="bolum" data-t="${sn(t)}"><time>${t}</time>${a}</button>`).join('')}</div></div>
      ${ileri(m, 'v' + (j + 1), 'videoTamam')}`;
  }

  function gorsel(g, c) {
    switch (g.tip) {
      case 'alinti': return `<blockquote class="g-alinti${g.zayif ? ' zayif' : ''}">${esc(g.metin)}</blockquote>`;
      case 'karsilastir': return `<div class="g-kars"><div><small>${ic('x')}${g.a[0]}</small><p>${esc(g.a[1])}</p></div><div><small>${ic('check')}${g.b[0]}</small><p>${esc(g.b[1])}</p></div></div>`;
      case 'akis': return `<div class="g-akis">${g.adimlar.map(([b, s]) => `<div><b>${b}</b><span>${esc(s)}</span></div>`).join('')}</div>`;
      case 'degisken': return `<div class="deg"><div class="dk"><small>Bağımsız değişken</small><b>${c.bagimsiz}</b></div>${ic('sag')}<div class="dk b"><small>Bağımlı değişken</small><b>${c.bagimli}</b></div><div class="deg-k">Kontrol altında tutulanlar ${c.kontrol.map(x => `<span>${x}</span>`).join('')}</div></div>`;
      case 'desen': return `<div class="g-desen"><b>${g.ad}</b><p>${esc(g.soru)}</p><span>${g.nasil}</span></div>`;
      case 'nokta': {
        const sec = { evren: [[], [], []], rastgele: [[3, 8, 11, 15, 17], [2, 6, 13, 19], []], tabakali: [[2, 9, 16], [4, 11, 17], [1, 8, 14]] }[g.mod];
        return `<figure class="g-nokta">${c.tabakalar.map((t, ti) => `<div class="t${ti}"><label>${t}</label><div class="satir">${Array.from({ length: 20 }, (_, n) => `<i class="r${sec[ti].includes(n) ? ' s' : ''}"></i>`).join('')}</div></div>`).join('')}<figcaption>${esc(g.not)}</figcaption></figure>`;
      }
      case 'arac': return `<div class="g-arac"><small>Ölçülecek şey</small><b>${c.bagimli}</b><small class="g-arac-ara">Ölçme aracı</small><b>${c.arac}</b></div>`;
      case 'hedef': {
        const h = pts => `<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="var(--bg)" stroke="var(--cizgi)" stroke-width="2"/><circle cx="50" cy="50" r="31" fill="none" stroke="var(--cizgi)" stroke-width="2"/><circle cx="50" cy="50" r="16" fill="none" stroke="var(--cizgi)" stroke-width="2"/><circle cx="50" cy="50" r="4" fill="var(--cizgi)"/>${pts.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="4.5" fill="var(--vurgu)"/>`).join('')}</svg>`;
        return `<div class="g-hedef"><div>${h([[72, 26], [77, 31], [69, 32], [74, 22], [79, 25]])}<span>Tutarlı ama yanlış yeri ölçüyor</span></div><div>${h([[48, 49], [53, 52], [50, 45], [45, 53], [55, 47]])}<span>Tutarlı ve doğru yeri ölçüyor</span></div></div>`;
      }
      case 'tablo': return `<table class="g-tablo"><thead><tr><th>Grup</th><th>${c.veri.olcu}</th></tr></thead><tbody>${c.veri.etiket.map((e, i) => `<tr><td>${e}</td><td>${sayi(c.veri.deger[i])}</td></tr>`).join('')}</tbody></table>`;
      case 'grafik': return grafikHTML(c);
      default: return '';
    }
  }
  function grafikHTML(c) {
    const max = Math.max(...c.veri.deger) * 1.15;
    return `<figure class="g-grafik"><figcaption>${c.veri.olcu}</figcaption>
      <div class="alan-g">${c.veri.deger.map(v => `<div class="sutun"><b>${sayi(v)}</b><i style="height:${(v / max * 100).toFixed(1)}%"></i></div>`).join('')}</div>
      <div class="etk">${c.veri.etiket.map(e => `<span>${e}</span>`).join('')}</div></figure>`;
  }

  function bagSecici(m, b) {
    const l = siraliAltlar(), p = P();
    if (l.length < 2) return '';
    const gruplar = p.secilen.map(ilgi).filter(Boolean).map(k => ({ k, l: l.filter(x => x.k === k) })).filter(g => g.l.length);
    return `<label class="bag" for="bagSec"><small>Örneğin konusu</small><select id="bagSec" data-m="${m.id}">${gruplar.map(g => `<optgroup label="${g.k.ad}">${g.l.map(x => `<option value="${x.a.id}"${x.a.id === b.alt.id ? ' selected' : ''}>${esc(x.a.ad)}</option>`).join('')}</optgroup>`).join('')}</select></label>`;
  }
  function senaryo(b, c) {
    return `<div class="senaryo kapak${ac(b.ilgi)}" style="${stil(b.ilgi)}"><div><small>${esc(b.alt.ad)}</small><h2>${c.tema}</h2>${b.detay ? `<p class="sen-detay">Senin notun: “${esc(b.detay)}”</p>` : ''}</div>${obj(b.ilgi.obj, 0.3)}</div>`;
  }
  function arastirmaNotu(m, b) {
    if (!UI.notlar) return '';
    const kucuk = s => s.toLocaleLowerCase('tr');
    const neden = b.neden === 'secim' ? 'Bağlam, “Örneğin konusu” seçicisiyle elle değiştirildi. Asıl uygulamada bu seçici olmayacak.'
      : `En az 3 puan verilen alt alanlar, farklı ilgi alanlarına öncelik verilerek modüllere sırayla dağıtılır. Bu modüle düşen alt alan: ${esc(b.alt.ad)} (${b.p}/5).`;
    const tane = b.duzey === 'alt'
      ? `Alt alan düzeyi. Senaryo ${kucuk(b.ilgi.ad)} genelinden değil, doğrudan ${esc(kucuk(b.alt.ad))} için yazıldı.${b.detay ? ' Öğrencinin profilde yazdığı not başlıkta gösteriliyor; bu, bireysel düzeye yaklaşan bir adım.' : ''}`
      : `Kategori düzeyi. Öğrencinin eklediği “${esc(b.alt.ad)}” için hazır senaryo yok; ${kucuk(b.ilgi.ad)} kategorisinin genel senaryosu kullanılıyor. Asıl uygulamada bu alanlar için senaryo yazılması ya da üretilmesi gerekir.`;
    const derin = b.c.derinlik ? `Derin. ${b.c.derinlik} Değişkenler ve sayılar o alanın kendi uygulamasından geliyor; yalnızca isimler değiştirilmiyor.` : 'Yüzeye yakın. Kategori senaryosu öğrencinin eklediği alanın kendine özgü uygulamalarını yansıtmıyor.';
    const acikUclu = m.gorev.parcalar.some(p => ['soruYaz', 'gorusme', 'bulguYaz'].includes(p));
    return `<aside class="ar-not" aria-label="Araştırmacı notu"><h3>Kişiselleştirme notu <small>Öğrenci bu kutuyu görmez</small></h3><dl>
      <div><dt>Neden bu bağlam</dt><dd>${neden}</dd></div>
      <div><dt>Ayrıntı düzeyi (grain size)</dt><dd>${tane}</dd></div>
      <div><dt>Derinlik (depth)</dt><dd>${derin}</dd></div>
      <div><dt>Sahiplik (ownership)</dt><dd>Alt alanları öğrenci kendisi seçti ve puanladı${b.alt.ozel ? '; bu alt alanı listeye öğrenci ekledi' : ''}.${acikUclu ? ' Açık uçlu görevde öğrenci kendi metnini yazıyor.' : ''}</dd></div>
      <div><dt>Sabit tutulanlar</dt><dd>Konu anlatım videoları, adım sayısı, görev türü ve ölçekler bütün öğrencilerde aynı. Yalnızca örneğin bağlamı değişiyor.</dd></div>
    </dl></aside>`;
  }

  function dOrnek(m) {
    const p = il(m.id), b = baglamAl(m), c = b.c, adim = D.ornekler[m.id](c);
    const acik = UI.ornekAcik[m.id] || (p.ornek ? adim.length : 1);
    return `<div class="ic-bas"><div><h1>${m.ornek.ad}</h1><p>Konuyu adım adım, ${b.ilgi.ad.toLocaleLowerCase('tr')} dünyasından bir örnekle uygula.</p></div>${bagSecici(m, b)}</div>
      ${senaryo(b, c)}
      ${arastirmaNotu(m, b)}
      <ol class="adm">${adim.map((a, i) => i < acik
        ? `<li id="adm-${i}"><span class="adm-no">${i + 1}</span><div class="adm-ic"><div><h3>${a.b}</h3><p>${a.t}</p></div><div>${gorsel(a.g, c)}</div></div></li>`
        : `<li class="kapali"><span class="adm-no">${i + 1}</span><h3>${a.b}</h3></li>`).join('')}</ol>
      ${acik < adim.length
        ? `<div class="adim-alt"><span>${acik}/${adim.length} adım</span><button class="btn lg" data-act="ornekAc" data-m="${m.id}">Sonraki adım ${ic('asagi')}</button></div>`
        : ileri(m, 'ornek', 'ornekTamam', 'Mikro göreve geç')}`;
  }

  /* ---------- Mikro görev ---------- */
  const TB_RENK = ['#17A594', '#5B6BE8', '#F07BA0'];
  function gorevDurum(key, ctx, ilk) {
    let st = UI.gs[key];
    if (!st || st.ctx !== ctx) st = UI.gs[key] = { ctx, kontrol: false, ...ilk() };
    return st;
  }
  function gorevHTML(m, pk) {
    const b = baglamAl(m), c = b.c, g = D.gorevler[pk](c), key = m.id + '-' + pk;
    const kont = `<div class="gorev-alt"><button class="btn ghost" data-act="kontrol" data-key="${key}">Kontrol et</button></div>`;
    if (g.tip === 'sirala') {
      const st = gorevDurum(key, b.ilgi.id, () => ({ sira: karistir(g.ogeler.map((_, i) => i), key) }));
      const dogru = st.sira.filter((oi, pos) => oi === pos).length;
      return `<p class="gorev-soru">${g.soru}</p><p class="gorev-yon">Sürükleyerek ya da oklarla yerini değiştir.</p>
        <ol class="sr">${st.sira.map((oi, pos) => { const o = g.ogeler[oi]; return `<li draggable="true" data-pos="${pos}" class="${st.kontrol ? (oi === pos ? 'd' : 'y') : ''}"><span class="no">${pos + 1}</span>${ic('tut', 'tut')}<span class="sr-t"><b>${o[0]}</b><small>${esc(o[1])}</small></span><span class="sr-ok"><button data-act="srTasi" data-key="${key}" data-pos="${pos}" data-yon="-1" aria-label="${o[0]}: yukarı taşı"${pos ? '' : ' disabled'}>${ic('yukari')}</button><button data-act="srTasi" data-key="${key}" data-pos="${pos}" data-yon="1" aria-label="${o[0]}: aşağı taşı"${pos < st.sira.length - 1 ? '' : ' disabled'}>${ic('asagi')}</button></span></li>`; }).join('')}</ol>
        ${st.kontrol ? `<div class="gb ${dogru === st.sira.length ? 'd' : 'y'}">${ic('bilgi')}${dogru === st.sira.length ? 'Sıralama doğru. Araştırma soruyla başlar, raporla biter.' : `${dogru}/${st.sira.length} adım doğru yerde. Kırmızı olanları yeniden düşün.`}</div>` : ''}${kont}`;
    }
    if (g.tip === 'siniflandir') {
      const st = gorevDurum(key, b.ilgi.id, () => ({ yer: {}, sec: null, sira: karistir(g.ogeler.map((_, i) => i), key) }));
      const cip = i => `<button class="cip${st.sec === i ? ' sec' : ''}${st.kontrol && st.yer[i] != null ? (st.yer[i] === g.ogeler[i][1] ? ' d' : ' y') : ''}" draggable="true" data-act="cipSec" data-key="${key}" data-i="${i}" aria-pressed="${st.sec === i}">${esc(g.ogeler[i][0])}</button>`;
      const yerlesen = Object.keys(st.yer).length, dogru = g.ogeler.filter((o, i) => st.yer[i] === o[1]).length;
      return `<p class="gorev-soru">${esc(g.soru)}</p><p class="gorev-yon">${g.yonerge} Bir ifadeye dokun, sonra kutusunu seç.</p>
        <div class="havuz" data-act="kutuSec" data-key="${key}" data-kutu="-1">${st.sira.filter(i => st.yer[i] == null).map(cip).join('')}</div>
        <div class="kutular">${g.kutular.map((kt, ki) => `<div class="kutu" role="button" tabindex="0" data-act="kutuSec" data-key="${key}" data-kutu="${ki}"><h4>${kt}</h4>${st.sira.filter(i => st.yer[i] === ki).map(cip).join('')}</div>`).join('')}</div>
        ${st.kontrol ? `<div class="gb ${yerlesen === g.ogeler.length && dogru === yerlesen ? 'd' : 'y'}">${ic('bilgi')}${yerlesen < g.ogeler.length ? 'Önce bütün ifadeleri bir kutuya yerleştir.' : dogru === yerlesen ? 'Hepsi doğru yerde.' : `${dogru}/${yerlesen} doğru. Kırmızı olanları başka bir kutuya taşı.`}</div>` : ''}${kont}`;
    }
    if (g.tip === 'acik') {
      const v = S.cevap[key] || '';
      return `<p class="gorev-soru">${esc(g.soru)}</p><div class="acik-duzen"><div><textarea id="ta-${key}" data-cevap="${key}" placeholder="${esc(g.yer)}" aria-label="Yanıtın">${esc(v)}</textarea><span class="sayac" id="say-${key}">${kelime(v)} kelime · otomatik kaydedilir</span></div>
        <aside class="ipucu"><h4>Yazarken kontrol et</h4><ul>${g.ipucu.map(x => `<li>${x}</li>`).join('')}</ul></aside></div>`;
    }
    if (g.tip === 'orneklem') {
      const st = gorevDurum(key, b.ilgi.id, () => ({ sec: [[], [], []] }));
      const tamam = st.sec.every(s => s.length === g.adet);
      return `<p class="gorev-soru">${esc(g.soru)}</p><p class="gorev-yon">Her nokta bir ${c.birim}. Seçmek için dokun.</p>
        <div class="tabakalar">${g.tabakalar.map((t, ti) => { const n = st.sec[ti].length; return `<div class="tb" style="--tc:${TB_RENK[ti]}"><div class="tb-bas"><b>${t}</b><span class="${n === g.adet ? 'tam' : n > g.adet ? 'fazla' : ''}">${n}/${g.adet}</span></div><div class="tb-n">${Array.from({ length: 12 }, (_, ni) => `<button class="${st.sec[ti].includes(ni) ? 's' : ''}" data-act="tbSec" data-key="${key}" data-t="${ti}" data-n="${ni}" aria-pressed="${st.sec[ti].includes(ni)}" aria-label="${t}, ${ni + 1}. ${c.birim}"></button>`).join('')}</div></div>`; }).join('')}</div>
        ${st.kontrol ? `<div class="gb ${tamam ? 'd' : 'y'}">${ic('bilgi')}${tamam ? `Her tabakadan ${g.adet} ${c.birim} seçtin. Örneklemde üç grup da eşit biçimde temsil ediliyor.` : `Her tabakadan tam ${g.adet} ${c.birim} seçmelisin. Sayısı tutmayan tabakaları düzelt.`}</div>` : ''}${kont}`;
    }
    if (g.tip === 'secim') {
      const st = gorevDurum(key, b.ilgi.id, () => ({ sec: null, sira: karistir([0, 1, 2], key) }));
      return `<div class="iki-kol"><div>${grafikHTML(c)}</div><div class="secim-kol"><p class="gorev-soru">${g.soru}</p>
        <div class="secenekler" role="radiogroup">${st.sira.map(i => { const s = g.secenekler[i], on = st.sec === i; return `<button role="radio" aria-checked="${on}" class="secenek${on ? (st.kontrol ? (s[1] ? ' d' : ' y') : ' sec') : ''}" data-act="secenek" data-key="${key}" data-i="${i}"><i></i><span>${esc(s[0])}</span></button>`; }).join('')}</div>
        ${st.kontrol && st.sec != null ? `<div class="gb ${g.secenekler[st.sec][1] ? 'd' : 'y'}">${ic('bilgi')}${esc(g.secenekler[st.sec][2])}</div>` : ''}${kont}</div></div>`;
    }
    return '';
  }
  function dGorev(m) {
    const b = baglamAl(m);
    return `<div class="ic-bas"><div><h1>${m.gorev.ad}</h1><p>${b.c.tema} örneği üzerinden.</p></div>${bagSecici(m, b)}</div>
      ${arastirmaNotu(m, b)}
      ${m.gorev.parcalar.map(pk => `<section class="gorev" data-gm="${m.id}" data-pk="${pk}">${gorevHTML(m, pk)}</section>`).join('')}
      ${ileri(m, 'gorev', 'gorevTamam', 'Görevi tamamla')}`;
  }
  function gorevYenile(key) {
    const [mid, pk] = key.split('-'), sec = $(`section[data-gm="${mid}"][data-pk="${pk}"]`);
    if (sec) sec.innerHTML = gorevHTML(modul(mid), pk);
  }

  /* ---------- Ölçekler ---------- */
  function dDuygu(m) {
    const p = il(m.id), n = Object.keys(p.duygu).length;
    return `<div class="ic-bas"><div><h1>Bu modülde neler hissettin?</h1><p>Her duyguyu ne kadar yaşadığını seç. Küçük daire “hiç”, büyük daire “çok yoğun” demek.</p></div></div>
      <div class="olcek"><div class="ol-ust"><span></span><div><span>Hiç</span><span>Çok yoğun</span></div></div>
        ${D.duygular.map((d, i) => `<div class="du"><b>${d}</b><div class="du-sec" role="radiogroup" aria-label="${d}">${[1, 2, 3, 4, 5].map(v => `<button class="b${v}${p.duygu[i] === v ? ' on' : ''}" role="radio" aria-checked="${p.duygu[i] === v}" aria-label="${d}: ${v}" data-act="olcek" data-tur="duygu" data-m="${m.id}" data-i="${i}" data-v="${v}"></button>`).join('')}</div></div>`).join('')}</div>
      ${olcekAlt(m, 'duygu', n, D.duygular.length)}`;
  }
  function dIlgi(m) {
    const p = il(m.id), etiketler = ['Benim için kesinlikle doğru değil', 'Benim için doğru değil', 'Kararsızım', 'Benim için doğru', 'Benim için kesinlikle doğru'];
    const n = D.ilgiMaddeleri.filter((_, i) => p.ilgi[i] != null).length;
    return `<div class="ic-bas"><div><h1>Bu modül hakkında ne düşünüyorsun?</h1><p>Her ifadenin senin için ne kadar doğru olduğunu seç. 1 benim için kesinlikle doğru değil, 5 benim için kesinlikle doğru.</p></div></div>
      <div class="olcek"><div class="ol-ust"><span></span><div><span>Benim için kesinlikle doğru değil</span><span>Benim için kesinlikle doğru</span></div></div>
        ${D.ilgiMaddeleri.map((d, i) => `<div class="li"><p>${d}</p><div class="li-sec" role="radiogroup" aria-label="${esc(d)}">${[1, 2, 3, 4, 5].map(v => `<button class="${p.ilgi[i] === v ? 'on' : ''}" role="radio" aria-checked="${p.ilgi[i] === v}" aria-label="${esc(d)}: ${v} (${etiketler[v - 1]})" title="${etiketler[v - 1]}" data-act="olcek" data-tur="ilgi" data-m="${m.id}" data-i="${i}" data-v="${v}">${v}</button>`).join('')}</div></div>`).join('')}</div>
      ${olcekAlt(m, 'ilgi', n, D.ilgiMaddeleri.length)}`;
  }
  function olcekAlt(m, tur, n, top) {
    const s = sonrakiAdim(m, tur);
    return `<div class="adim-alt"><span id="olSay">${n}/${top} yanıtlandı</span><button class="btn lg" id="olDevam" data-act="olcekBitir" data-m="${m.id}" data-tur="${tur}" data-r="ders-${m.id}-${s}"${n < top ? ' disabled' : ''}>${s === 'son' ? 'Modülü bitir' : 'Devam et'} ${ic('sag')}</button></div>`;
  }

  function sDers(m, k) {
    const i = D.moduller.indexOf(m), t = tamamSay(m);
    let govde = '';
    if (/^v[1-3]$/.test(k)) govde = dVideo(m, +k[1] - 1);
    else if (k === 'ornek') govde = dOrnek(m);
    else if (k === 'gorev') govde = dGorev(m);
    else if (k === 'duygu') govde = dDuygu(m);
    else if (k === 'ilgi') govde = dIlgi(m);
